services:
  # FastAPI Backend Service
  - type: web
    name: ai-ats-api
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    plan: free
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: https://your-streamlit-app.streamlit.app

  # Streamlit Frontend Service
  - type: web
    name: ai-ats-ui
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    plan: free
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: API_URL
        fromService:
          name: ai-ats-api
          type: web
          property: host
      - key: SECRET_KEY
        sync: false
